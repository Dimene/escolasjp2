; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

; =========================================================
; CONFIGURACAO PHP 8.3 - LARAVEL + EXCEL + IMAGENS
; =========================================================

; -------------------------
; ERROS
; -------------------------
display_errors = Off
log_errors = On

; -------------------------
; PERFORMANCE GERAL
; -------------------------
memory_limit = 2048M
max_execution_time = 300
max_input_time = 300
max_input_vars = 100000

output_buffering = 4096

; -------------------------
; UPLOADS
; -------------------------
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 100

; -------------------------
; CACHE / PERFORMANCE
; -------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; -------------------------
; OPcache (MUITO IMPORTANTE)
; -------------------------
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=100000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.fast_shutdown=1
opcache.save_comments=1

; JIT PHP 8.3
opcache.jit=1255
opcache.jit_buffer_size=256M

; -------------------------
; EXTENSOES IMPORTANTES (COMPLETO)
; -------------------------
; Extensoes basicas
extension=fileinfo
extension=exif

; Extensoes para Excel (PHPExcel / Laravel Excel)
extension=zip
extension=xml
extension=simplexml

; Extensoes para imagens
extension=gd

; Extensoes para banco de dados (Laravel)
extension=pdo_mysql
extension=mysqli

; Extensoes para manipulacao de strings e requisicoes
extension=mbstring
extension=curl
extension=json
extension=tokenizer
extension=ctype

; Extensoes para cache e sessao
extension=session

; Extensoes para criptografia e seguranca
extension=openssl
extension=hash
extension=filter

; -------------------------
; SESSAO
; -------------------------
session.gc_maxlifetime = 7200
session.save_path = "/var/cpanel/php/sessions/alt-php83"

; -------------------------
; COMPACTACAO
; -------------------------
zlib.output_compression = On

; -------------------------
; MYSQL / TIMEOUT
; -------------------------
mysql.connect_timeout = 300
default_socket_timeout = 300

; -------------------------
; SEGURANCA
; -------------------------
expose_php = Off
allow_url_fopen = On

; -------------------------
; TIMEZONE
; -------------------------
date.timezone = Africa/Maputo
